[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "boxen"
version = "0.1.0"
description = "Private, local box inventory with reviewed local vision AI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14", "argon2-cffi>=23.1",
  "markdown-it-py>=3", "nh3>=0.2", "pillow>=11", "segno>=1.6",
  "reportlab>=4", "python-multipart>=0.0.20", "httpx>=0.28",
  "jsonschema>=4.23", "pyyaml>=6", "referencing>=0.36"
]

[project.scripts]
boxen = "boxen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15", "openapi-spec-validator>=0.7", "pypdf>=5", "zxing-cpp>=2", "types-PyYAML>=6", "pip-audit>=2", "mutmut>=3"]

[tool.hatch.build.targets.wheel]
packages = ["backend/boxen"]

[tool.hatch.build]
artifacts = ["backend/boxen/static/**"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
