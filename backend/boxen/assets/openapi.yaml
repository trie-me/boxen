openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Boxen Local API
  version: 1.0.0
  summary: Same-origin API for the locally hosted Boxen inventory system.
  description: >-
    This contract is normative for Boxen v1 HTTP field names and wire formats.
    The API is served only from the configured local Boxen origin: trusted-LAN
    HTTP is supported in development; production requires HTTPS.
    Anonymous access is configured server-side as off, viewer, or editor (default).
    When enabled, GET /session issues a per-browser session cookie and CSRF token
    without login. Other protected operations still require that session cookie.
    Anonymous access never grants user management, system administration, backup,
    or permanent purge permissions.
servers:
  - url: /api/v1
    description: Same-origin local Boxen server
tags:
  - name: Authentication
  - name: Users
  - name: Boxes
  - name: Images
  - name: Inventory
  - name: Analysis
  - name: Discovery
  - name: Labels
  - name: Operations
security:
  - cookieSession: []
paths:
  /setup/status:
    get:
      tags: [Authentication]
      operationId: getSetupStatus
      summary: Report whether first-owner setup is required.
      description: The reserved anonymous identity does not count as a configured local user.
      security: []
      responses:
        '200':
          description: Setup status with no installation details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatusView' }

  /setup/owner:
    post:
      tags: [Authentication]
      operationId: createFirstOwner
      summary: Create the first owner using the one-time host setup token.
      security: []
      parameters:
        - $ref: '#/components/parameters/SetupToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerSetupRequest' }
      responses:
        '201':
          description: First owner and authenticated session created.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a local user session.
      description: Requires local user credentials; the reserved anonymous identity cannot log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session.
          headers:
            Set-Cookie:
              schema: { type: string }
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Read the current user, CSRF token, and capabilities.
      description: >-
        Preserves a valid local or anonymous session. When anonymous access is enabled,
        a missing or expired session is replaced with a new per-browser anonymous
        session at the configured viewer or editor role. When disabled, a valid
        local user session is required. An explicit Origin must match the configured
        origin when anonymous access is enabled.
      security:
        - cookieSession: []
        - {}
      responses:
        '200':
          description: Current session.
          headers:
            Set-Cookie:
              description: Per-browser session cookie when an anonymous session is created.
              schema: { type: string }
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /session/profile:
    patch:
      tags: [Authentication]
      operationId: updateOwnProfile
      summary: Change the current user's display name.
      description: Available to local user accounts only; anonymous profiles cannot be changed.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfilePatch' }
      responses:
        '200':
          description: Updated current user.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /session/password:
    post:
      tags: [Authentication]
      operationId: changeOwnPassword
      summary: Change the current user's password and rotate the session.
      description: Available to local user accounts only; anonymous access has no password.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: Password changed and session rotated.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    get:
      tags:
      - Authentication
      operationId: listAuthSessions
      summary: List the latest 500 user sign-in sessions (owner only).
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/sessions/{session_id}:
    delete:
      tags:
      - Authentication
      operationId: revokeAuthSession
      summary: Revoke one session after recent owner sign-in.
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Operation completed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{user_id}/revoke-sessions:
    post:
      tags:
      - Authentication
      operationId: revokeUserSessions
      summary: Revoke all sessions for this user after recent owner sign-in.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - revoked
                properties:
                  revoked:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/events:
    get:
      tags:
      - Authentication
      operationId: listAuthEvents
      summary: List recent authentication audit events (owner only).
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthEventView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/providers:
    get:
      tags:
      - Authentication
      operationId: listAuthProviders
      summary: List enabled OpenID Connect sign-in providers.
      security: []
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProviderView'
  /auth/oidc/{provider_id}/start:
    post:
      tags:
      - Authentication
      operationId: startOIDCSignIn
      summary: Begin browser-bound authorization-code sign-in with PKCE.
      security: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - authorization_url
                properties:
                  authorization_url:
                    type: string
  /auth/oidc/{provider_id}/callback:
    get:
      tags:
      - Authentication
      operationId: completeOIDCSignIn
      summary: Validate a one-time provider response and redirect to Boxen.
      security: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Operation completed.
  /auth/provider-status:
    get:
      tags:
      - Authentication
      operationId: listAuthProviderStatus
      summary: Inspect configured sign-in providers (owner only).
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProviderStatusView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/identities:
    get:
      tags:
      - Authentication
      operationId: listAuthIdentities
      summary: List explicit provider subject bindings (owner only).
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthIdentityView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Authentication
      operationId: linkAuthIdentity
      summary: Bind a provider subject to an existing local user after recent owner
        sign-in.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - user_id
              - provider_id
              - subject
              properties:
                user_id:
                  $ref: '#/components/schemas/Uuid'
                provider_id:
                  type: string
                subject:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthIdentityView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/identities/{identity_id}:
    delete:
      tags:
      - Authentication
      operationId: unlinkAuthIdentity
      summary: Unlink an identity and revoke the user sessions after recent owner sign-in.
      parameters:
      - name: identity_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Operation completed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List local users. Owner only.
      responses:
        '200':
          description: Local users.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a local user. Owner only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: User created.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Read a local user. Owner only.
      responses:
        '200':
          description: User.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change display name, role, status, or password. Owner only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: Updated user.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /boxes:
    get:
      tags: [Boxes]
      operationId: listBoxes
      summary: List boxes visible to the current user.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/CollectionFilter'
        - name: lifecycle
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_desc, name_asc, created_desc]
            default: updated_desc
      responses:
        '200':
          description: Page of boxes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Boxes]
      operationId: createBox
      summary: Create a box. Editor or owner.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoxCreate' }
      responses:
        '201':
          description: Created box.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /boxes/{box_code}:
    parameters:
      - $ref: '#/components/parameters/BoxCode'
    get:
      tags: [Boxes]
      operationId: getBox
      summary: Read composed box details.
      responses:
        '200':
          description: Box detail.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Boxes]
      operationId: updateBox
      summary: Update box metadata, tags, or collection membership. Editor or owner.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoxPatch' }
      responses:
        '200':
          description: Updated box.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /tags:
    get:
      tags: [Organization]
      operationId: listTags
      summary: List tag vocabulary with active box counts, including unused tags.
      responses:
        '200':
          description: Tags ordered by normalized name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /collections:
    get:
      tags: [Organization]
      operationId: listCollections
      summary: List all collections, optionally filtering their names and plain descriptions.
      parameters:
        - name: q
          in: query
          description: Case-insensitive literal substring; does not search member boxes or items.
          schema: { type: string, maxLength: 256, default: '' }
      responses:
        '200':
          description: Collections ordered by normalized name; no pagination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Organization]
      operationId: createCollection
      summary: Create a collection with optional active member boxes. Editor or owner.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionCreate' }
      responses:
        '201':
          description: Created collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /collections/{collection_id}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      tags: [Organization]
      operationId: getCollection
      summary: Read all member boxes and itemized inventory retaining each source box.
      parameters:
        - name: include_archived
          in: query
          description: Include archived boxes in items. The boxes list always includes all members.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Collection and its members.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Organization]
      operationId: updateCollection
      summary: Replace supplied metadata or memberships; omitted fields preserve values. Editor or owner.
      description: Archived memberships may be retained but cannot be added or removed. Changes are atomic.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionPatch' }
      responses:
        '200':
          description: Updated collection; itemization excludes archived boxes.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Organization]
      operationId: deleteCollection
      summary: Dissolve the collection, preserving all boxes, items, and tags. Editor or owner.
      description: Dissolution also removes archived memberships and updates affected box versions.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
