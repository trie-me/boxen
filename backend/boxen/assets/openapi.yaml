  /boxes/{box_code}/observations/review:
    post:
      tags: [Analysis]
      operationId: reviewBoxObservations
      summary: Atomically review suggestions and add manual items. Editor or owner.
      description: |
        Applies only the submitted actions to an active box, including for anonymous editors.
        All observation IDs must be unique across accept and reject, pending, and in this box.
        Other pending suggestions, including those from later photos, remain untouched.
        All actions commit together; invalid, stale, missing, or cross-box references roll back
        the entire review. Merge ETags are checked against the initial transaction state;
        multiple links to one item must each supply that same initial ETag. Links preserve
        quantity unless an explicit item_patch changes it; they never add observation quantities.
        Accepted items retain their source observations. Added items have manual provenance.
        Repeating the same request with the same idempotency key returns the saved response;
        changing the body with that key returns a conflict.
      parameters:
        - $ref: '#/components/parameters/BoxCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationReviewRequest' }
      responses:
        '200':
          description: Committed review; each result array follows its request array order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationReviewResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

