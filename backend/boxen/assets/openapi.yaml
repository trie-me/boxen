          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LabelProfileView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /boxes/{box_code}/label.pdf:
    get:
      tags: [Labels]
      operationId: renderBoxLabel
      summary: Render a print-ready label PDF. Editor or owner.
      parameters:
        - $ref: '#/components/parameters/BoxCode'
        - name: profile
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Deterministic label PDF.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /labels.pdf:
    post:
      tags: [Labels]
      operationId: renderLabelSheet
      summary: Render one label per selected box on US Letter sheets. Editor or owner.
      description: Read-only PDF generation. Pin order is preserved; collections use name/code order and include archived members. No partial output for missing boxes or empty collections. Maximum 500 labels.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelSheetRequest' }
      responses:
        '200':
          description: Deterministic Letter PDF, ten 4 x 2-inch labels per page.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Process liveness with no dependency details.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessView' }

  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Minimal readiness for local supervisor use.
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessView' }
        '503':
          description: Not ready.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /system:
    get:
      tags: [Operations]
      operationId: getSystemStatus
      summary: Read authorized component, capacity, and model status.
      responses:
        '200':
          description: System status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatusView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /backups:
    get:
      tags: [Operations]
      operationId: listBackups
      summary: List backup records. Owner only.
      responses:
        '200':
          description: Backup records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BackupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operations]
      operationId: createBackup
      summary: Start a consistent backup. Owner only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Backup accepted.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /backups/{backup_id}:
    get:
      tags: [Operations]
      operationId: getBackup
      summary: Read backup state. Owner only.
      parameters:
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: Backup record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /backups/{backup_id}/verify:
    post:
      tags: [Operations]
      operationId: verifyBackup
      summary: Re-verify an existing backup. Owner only.
      parameters:
        - $ref: '#/components/parameters/BackupId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Verification accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /maintenance/search/verify:
    post:
      tags: [Operations]
      operationId: verifySearchProjection
      summary: Start search projection verification. Owner only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Maintenance job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceJobView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /maintenance/search/rebuild:
    post:
      tags: [Operations]
      operationId: rebuildSearchProjection
      summary: Start search projection rebuild. Owner only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Maintenance job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceJobView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /maintenance/media/verify:
    post:
      tags: [Operations]
      operationId: verifyMedia
      summary: Start media integrity verification. Owner only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Maintenance job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceJobView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /maintenance/{job_id}:
    get:
      tags: [Operations]
      operationId: getMaintenanceJob
      summary: Read a maintenance job. Owner only.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Maintenance job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceJobView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: boxen_session
      description: >-
        HttpOnly, SameSite=Strict session cookie, Secure over HTTPS. Issued by
        local login, first-owner setup, or GET /session when anonymous access is
        enabled. Anonymous mutations retain the same Origin, CSRF, role, and
        resource-version checks as local user sessions.

  headers:
    RequestId:
      description: Correlation identifier for this request.
      schema: { type: string, minLength: 8, maxLength: 128 }
    ETag:
      description: Strong resource version identifier.
      schema: { type: string }

  parameters:
    TagFilter:
      name: tag_id
      in: query
      description: Require membership in this exact tag, combined with all other filters using AND.
      schema: { $ref: '#/components/schemas/Uuid' }
    CollectionFilter:
      name: collection_id
      in: query
      description: Require membership in this exact collection, combined with all other filters using AND.
      schema: { $ref: '#/components/schemas/Uuid' }
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SetupToken:
      name: X-Boxen-Setup-Token
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 256 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Retry key scoped to the local user and operation. For anonymous access,
        replay is additionally isolated to the browser session and configured role.
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    BoxCode:
      name: box_code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BoxCode' }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ImageId:
      name: image_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ObservationId:
      name: observation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    BackupId:
      name: backup_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

  responses:
    NoContent:
      description: Operation completed with no response body.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Authentication is required or no longer valid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: The current user is not authorized.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Current lifecycle or domain state conflicts with the request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PreconditionFailed:
      description: The supplied ETag is stale.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PayloadTooLarge:
      description: Request or decoded image exceeds configured limits.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UnsupportedMediaType:
      description: Uploaded bytes are not a supported image type.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PreconditionRequired:
      description: If-Match is required for this mutation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unavailable:
      description: A required local component is temporarily unavailable.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    InsufficientStorage:
      description: Local disk reserve prevents this operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    BoxCode:
      type: string
      pattern: '^BX-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$'
      examples: [BX-7K3M-R9QA]
    Quantity:
      type: string
      pattern: '^(?:0\.(?:00[1-9]|0[1-9][0-9]|[1-9][0-9]{0,2})|[1-9][0-9]{0,5}(?:\.[0-9]{1,3})?)$'
      examples: ['1', '2.5', '999999.999']
    Role:
      type: string
      enum: [owner, editor, viewer]
    UserStatus:
      type: string
      enum: [active, disabled]
    BoxLifecycle:
      type: string
      enum: [active, archived]
    ItemLifecycle:
      type: string
      enum: [active, removed]
    AllowedAction:
      type: string
      enum:
        - box.read
        - box.edit
        - box.archive
        - box.restore
        - box.purge
        - image.upload
        - image.edit
        - image.remove
        - analysis.request
        - observation.review
        - inventory.edit
        - label.render
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    MarkdownView:
      type: object
      additionalProperties: false
      required: [source, html, text, renderer_version]
      properties:
        source: { type: string }
        html: { type: string }
        text: { type: string }
        renderer_version: { type: string }
    FieldError:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path: { type: string }
        code: { type: string }
        message: { type: string }
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    SetupStatusView:
      type: object
      additionalProperties: false
      required: [setup_required]
      properties:
        setup_required: { type: boolean }
    OwnerSetupRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 12, maxLength: 1024 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 12, maxLength: 1024 }
    UserProfilePatch:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
    SessionView:
      type: object
      additionalProperties: false
      required: [user, anonymous, csrf_token, expires_at, capabilities]
      properties:
        user: { $ref: '#/components/schemas/UserView' }
        anonymous:
          type: boolean
          description: True for the reserved anonymous principal; its role is configured server-side.
        csrf_token: { type: string }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
    UserView:
      type: object
      additionalProperties: false
      required: [id, username, display_name, role, status, version, created_at, updated_at, is_system_admin, local_password]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        is_system_admin: { type: boolean }
        local_password: { type: boolean }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, display_name, role, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 12, maxLength: 1024 }
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        password: { type: string, minLength: 12, maxLength: 1024 }

    AuthSessionView:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - username
      - method
      - created_at
      - last_seen_at
      - expires_at
      - revoked_at
      - active
      - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        username: &id001
          type: string
        method: *id001
        created_at:
          $ref: '#/components/schemas/DateTime'
        last_seen_at:
          $ref: '#/components/schemas/DateTime'
        expires_at:
          $ref: '#/components/schemas/DateTime'
        revoked_at: &id002
          type:
          - string
          - 'null'
        active:
          type: boolean
        current:
          type: boolean
    AuthEventView:
      type: object
      additionalProperties: false
      required:
      - id
      - occurred_at
      - user_id
      - username
      - action
      - method
      properties:
        id:
          type: integer
        occurred_at:
          $ref: '#/components/schemas/DateTime'
        user_id: *id002
        username: *id002
        action: *id001
        method: *id002

    AuthProviderView:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
    AuthProviderStatusView:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - issuer
      - client_id
      - configured
      - redirect_uri
      properties:
        id:
          type: string
        label:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        configured:
          type: boolean
        redirect_uri:
          type: string
    AuthIdentityView:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - provider_id
      - issuer
      - subject
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        provider_id:
          type: string
        issuer:
          type: string
        subject:
          type: string
        created_at:
          $ref: '#/components/schemas/DateTime'

    TagNames:
      type: array
      maxItems: 32
      description: Names are trimmed and NFC normalized; casefold-equivalent names reuse the first spelling. Empty clears tags.
      items: { type: string, minLength: 1, maxLength: 64 }
    CollectionIds:
      type: array
      maxItems: 100
      description: Exact collection memberships; duplicates collapse. Empty clears memberships; unknown IDs fail atomically.
      items: { $ref: '#/components/schemas/Uuid' }
    TagRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
    TagView:
      type: object
      additionalProperties: false
      required: [id, name, box_count]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        box_count: { type: integer, minimum: 0, description: Number of active member boxes. }
    TagList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TagView' }
    CollectionRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
    CollectionBoxCodes:
      type: array
      maxItems: 500
      description: Complete member list, including retained archived boxes; duplicates collapse. Empty clears active memberships.
      items: { $ref: '#/components/schemas/BoxCode' }
    CollectionCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: 'Trimmed NFC name, unique under casefold.' }
        description: { type: string, maxLength: 2000, default: '', description: 'Plain text, never rendered as Markdown or HTML.' }
        box_codes: { $ref: '#/components/schemas/CollectionBoxCodes' }
    CollectionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, description: 'Plain text, never rendered as Markdown or HTML.' }
        box_codes: { $ref: '#/components/schemas/CollectionBoxCodes' }
    CollectionSummary:
      type: object
      additionalProperties: true
      required: [id, name, description, version, box_count, archived_box_count, item_count, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string }
        version: { type: integer, minimum: 1 }
        box_count: { type: integer, minimum: 0, description: Active member boxes. }
        archived_box_count: { type: integer, minimum: 0 }
        item_count: { type: integer, minimum: 0, description: 'Active inventory lines in active member boxes, not a sum of quantities.' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    CollectionItem:
      type: object
      additionalProperties: false
      required: [box_code, box_name, box_lifecycle, item]
      properties:
        box_code: { $ref: '#/components/schemas/BoxCode' }
        box_name: { type: string }
        box_lifecycle: { $ref: '#/components/schemas/BoxLifecycle' }
        item: { $ref: '#/components/schemas/InventoryItemView' }
    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/CollectionSummary'
        - type: object
          required: [boxes, items]
          properties:
            boxes:
              type: array
              description: All member boxes, always including archived members so editors can preserve them.
              items: { $ref: '#/components/schemas/BoxSummary' }
            items:
              type: array
              description: Separate inventory lines retaining their source boxes and quantities; active boxes by default.
              items: { $ref: '#/components/schemas/CollectionItem' }
    CollectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CollectionSummary' }

    BoxCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description_markdown: { type: string, maxLength: 65536, default: '' }
        tags: { $ref: '#/components/schemas/TagNames' }
        collection_ids: { $ref: '#/components/schemas/CollectionIds' }
    BoxPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description_markdown: { type: string, maxLength: 65536 }
        tags: { $ref: '#/components/schemas/TagNames' }
        collection_ids: { $ref: '#/components/schemas/CollectionIds' }
    PurgeBoxRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code]
      properties:
        confirmation_code: { $ref: '#/components/schemas/BoxCode' }
    BoxSummary:
      type: object
      additionalProperties: true
      required:
        [code, name, lifecycle, version, tags, collections, image_count, item_count, pending_observation_count, created_at, updated_at, allowed_actions]
      properties:
        code: { $ref: '#/components/schemas/BoxCode' }
        name: { type: string }
        lifecycle: { $ref: '#/components/schemas/BoxLifecycle' }
        version: { type: integer, minimum: 1 }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagRef' }
        collections:
          type: array
          items: { $ref: '#/components/schemas/CollectionRef' }
        representative_thumbnail_url: { type: [string, 'null'], format: uri-reference }
        image_count: { type: integer, minimum: 0 }
        item_count: { type: integer, minimum: 0 }
        pending_observation_count: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
        allowed_actions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AllowedAction' }
    BoxDetail:
      allOf:
        - $ref: '#/components/schemas/BoxSummary'
        - type: object
          additionalProperties: true
          required: [description, images, items]
          properties:
            description: { $ref: '#/components/schemas/MarkdownView' }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageView' }
            items:
              type: array
              items: { $ref: '#/components/schemas/InventoryItemView' }
    BoxPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BoxSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }

    ImageView:
      type: object
      additionalProperties: false
      required:
        [id, box_code, lifecycle, caption, sort_order, version, original_filename, latest_analysis, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        box_code: { $ref: '#/components/schemas/BoxCode' }
        lifecycle:
          type: string
          enum: [staged, ready, rejected, deleted]
        caption: { type: string }
        sort_order: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        original_filename: { type: string }
        latest_analysis:
          description: Latest durable analysis job for this photo, including empty successful analyses.
          anyOf:
            - { $ref: '#/components/schemas/AnalysisJobView' }
            - { type: 'null' }
        media_type: { type: [string, 'null'], enum: [image/jpeg, image/png, image/webp, null] }
        byte_size: { type: [integer, 'null'], minimum: 1 }
        width: { type: [integer, 'null'], minimum: 1 }
        height: { type: [integer, 'null'], minimum: 1 }
        sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        thumbnail_url: { type: [string, 'null'], format: uri-reference }
        display_url: { type: [string, 'null'], format: uri-reference }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    ImagePatch:
      type: object
      additionalProperties: false
      required: [caption]
      properties:
        caption: { type: string, maxLength: 500 }
    ImageOrderRequest:
      type: object
      additionalProperties: false
      required: [image_ids]
      properties:
        image_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }

    InventoryItemCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        unit: { type: [string, 'null'], minLength: 1, maxLength: 24 }
        notes_markdown: { type: string, maxLength: 16384, default: '' }
    InventoryItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        unit: { type: [string, 'null'], minLength: 1, maxLength: 24 }
        notes_markdown: { type: string, maxLength: 16384 }
        lifecycle: { $ref: '#/components/schemas/ItemLifecycle' }
    InventoryItemView:
      type: object
      additionalProperties: false
      required:
        [id, box_code, name, quantity, unit, notes, provenance, lifecycle, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        box_code: { $ref: '#/components/schemas/BoxCode' }
        name: { type: string }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        unit: { type: [string, 'null'] }
        notes: { $ref: '#/components/schemas/MarkdownView' }
        provenance:
          type: string
          enum: [manual, ai, mixed]
        lifecycle: { $ref: '#/components/schemas/ItemLifecycle' }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    InventoryMergeRequest:
      type: object
      additionalProperties: false
      required: [survivor_id, merged_item_ids, survivor_etag]
      properties:
        survivor_id: { $ref: '#/components/schemas/Uuid' }
        merged_item_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        survivor_etag: { type: string }
        result:
          anyOf:
            - $ref: '#/components/schemas/InventoryItemPatch'
            - type: 'null'

    AnalysisRequest:
      type: object
      additionalProperties: false
      properties:
        model_profile: { type: string, minLength: 1, maxLength: 80 }
    AnalysisJobView:
      type: object
      additionalProperties: false
      required:
        [id, image_id, state, model_profile, prompt_version, attempt_count, max_attempts, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        image_id: { $ref: '#/components/schemas/Uuid' }
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        model_profile: { type: string }
        prompt_version: { type: string }
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        run_id: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        error:
          anyOf:
            - $ref: '#/components/schemas/BoundedError'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
        started_at: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        completed_at: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    BoundedError:
      type: object
      additionalProperties: false
      required: [code, summary]
      properties:
        code: { type: string }
        summary: { type: string, maxLength: 1000 }
    BoundingBox:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
    ObservationView:
      type: object
      additionalProperties: false
      required:
        [id, run_id, image_id, proposed_name, proposed_quantity, proposed_unit, confidence, attributes, decision, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        run_id: { $ref: '#/components/schemas/Uuid' }
        image_id: { $ref: '#/components/schemas/Uuid' }
        proposed_name: { type: string }
        proposed_quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        proposed_unit: { type: [string, 'null'] }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        bounding_box:
          anyOf:
            - $ref: '#/components/schemas/BoundingBox'
            - type: 'null'
        attributes:
          type: object
          additionalProperties:
            type: [string, number, boolean, 'null']
        decision:
          type: string
          enum: [pending, accepted, rejected, superseded]
        accepted_item_id: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        decided_at: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }
    ObservationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ObservationView' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ObservationReviewRequest:
      type: object
      additionalProperties: false
      required: [accept, reject, add]
      description: |
        Requires 1–500 actions total across all three arrays (combined limit enforced by the server).
        Observation IDs must be unique across accept and reject.
      anyOf:
        - properties:
            accept: { minItems: 1 }
        - properties:
            reject: { minItems: 1 }
        - properties:
            add: { minItems: 1 }
      properties:
        accept:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ObservationReviewAccept' }
        reject:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        add:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/InventoryItemCreate' }
    ObservationReviewAccept:
      type: object
      additionalProperties: false
      required: [observation_id, decision]
      properties:
        observation_id: { $ref: '#/components/schemas/Uuid' }
        decision: { $ref: '#/components/schemas/ObservationAcceptRequest' }
    ObservationReviewResult:
      type: object
      additionalProperties: false
      required: [accepted, rejected, added]
      description: Accepted item views reflect the final state after all actions, including repeated links.
      properties:
        accepted:
          type: array
          items: { $ref: '#/components/schemas/ObservationDecisionResult' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/ObservationView' }
        added:
          type: array
          items: { $ref: '#/components/schemas/InventoryItemView' }
    ObservationAcceptRequest:
      oneOf:
        - $ref: '#/components/schemas/ObservationAcceptCreate'
        - $ref: '#/components/schemas/ObservationAcceptMerge'
      discriminator:
        propertyName: mode
        mapping:
          create: '#/components/schemas/ObservationAcceptCreate'
          merge: '#/components/schemas/ObservationAcceptMerge'
    ObservationAcceptCreate:
      type: object
      additionalProperties: false
      required: [mode, item]
      properties:
        mode: { type: string, const: create }
        item: { $ref: '#/components/schemas/InventoryItemCreate' }
    ObservationAcceptMerge:
      type: object
      additionalProperties: false
      required: [mode, item_id, item_etag]
      properties:
        mode: { type: string, const: merge }
        item_id: { $ref: '#/components/schemas/Uuid' }
        item_etag: { type: string }
        item_patch:
          anyOf:
            - $ref: '#/components/schemas/InventoryItemPatch'
            - type: 'null'
    ObservationRejectRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [not_present, duplicate, too_vague, incorrect, other]
    ObservationDecisionResult:
      type: object
      additionalProperties: false
      required: [observation, item]
      properties:
        observation: { $ref: '#/components/schemas/ObservationView' }
        item: { $ref: '#/components/schemas/InventoryItemView' }
    AnalysisRunView:
      type: object
      additionalProperties: false
      required:
        [id, job_id, image_id, image_sha256, model, runtime, prompt_version, output_schema_version, status, observations, started_at, completed_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        job_id: { $ref: '#/components/schemas/Uuid' }
        image_id: { $ref: '#/components/schemas/Uuid' }
        image_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        model: { $ref: '#/components/schemas/ArtifactIdentity' }
        runtime: { $ref: '#/components/schemas/RuntimeIdentity' }
        prompt_version: { type: string }
        output_schema_version: { type: string }
        status: { type: string, enum: [succeeded, failed, cancelled] }
        metrics: { $ref: '#/components/schemas/AnalysisMetrics' }
        error:
          anyOf:
            - $ref: '#/components/schemas/BoundedError'
            - type: 'null'
        observations:
          type: array
          items: { $ref: '#/components/schemas/ObservationView' }
        started_at: { $ref: '#/components/schemas/DateTime' }
        completed_at: { $ref: '#/components/schemas/DateTime' }
    ArtifactIdentity:
      type: object
      additionalProperties: false
      required: [id, sha256]
      properties:
        id: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        projector_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    RuntimeIdentity:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: string }
    AnalysisMetrics:
      type: object
      additionalProperties: false
      properties:
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        input_tokens: { type: [integer, 'null'], minimum: 0 }
        output_tokens: { type: [integer, 'null'], minimum: 0 }
        peak_memory_bytes: { type: [integer, 'null'], minimum: 0 }

    SearchMatch:
      type: object
      additionalProperties: false
      required: [field, snippet, ranges]
      properties:
        field:
          type: string
          enum: [code, name, description, item_name, item_notes, tag, collection]
        snippet: { type: string }
        ranges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [start, end]
            properties:
              start: { type: integer, minimum: 0 }
              end: { type: integer, minimum: 0 }
    SearchResult:
      type: object
      additionalProperties: false
      required: [box, exact_code, matched_fields, matches, matching_items]
      properties:
        box: { $ref: '#/components/schemas/BoxSummary' }
        exact_code: { type: boolean }
        matched_fields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [code, name, description, item_name, item_notes, tag, collection] }
        matches:
          type: array
          items: { $ref: '#/components/schemas/SearchMatch' }
        matching_items:
          type: array
          items: { $ref: '#/components/schemas/InventoryItemView' }
    SearchPage:
      type: object
      additionalProperties: false
      required: [query, items, page]
      properties:
        query: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SearchSuggestion:
      type: object
      additionalProperties: false
      required: [kind, id, label, detail, box_code]
      properties:
        kind: { type: string, enum: [box, item, tag, collection] }
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }
        detail: { type: string }
        box_code:
          anyOf:
            - { $ref: '#/components/schemas/BoxCode' }
            - { type: 'null' }
    SearchSuggestions:
      type: object
      additionalProperties: false
      required: [query, kind, suggestions]
      properties:
        query: { type: string }
        kind: { type: string, enum: [none, box_code, text] }
        suggestions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/SearchSuggestion' }
    CodeResolveRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { type: string, minLength: 1, maxLength: 512 }
    CodeResolveResult:
      type: object
      additionalProperties: false
      required: [input_kind, canonical_payload, box]
      properties:
        input_kind: { type: string, enum: [box_code, qr_payload, local_url] }
        canonical_payload: { type: string, pattern: '^boxen:v1:BX-' }
        box: { $ref: '#/components/schemas/BoxSummary' }
    LabelSheetRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [box_codes]
        - required: [collection_id]
      properties:
        box_codes:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: One label per code, in the supplied order.
          items: { $ref: '#/components/schemas/BoxCode' }
        collection_id: { $ref: '#/components/schemas/Uuid' }
        start_position:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: First unused position on the first sheet; left to right, top to bottom.
        offset_x_mm: { type: number, minimum: -3, maximum: 3, default: 0, description: 'Positive moves right; applied to all sheets.' }
        offset_y_mm: { type: number, minimum: -3, maximum: 3, default: 0, description: 'Positive moves down; applied to all sheets.' }
    LabelProfileView:
      type: object
      additionalProperties: false
      required: [key, version, display_name, width_mm, height_mm]
      properties:
        key: { type: string }
        version: { type: integer, minimum: 1 }
        display_name: { type: string }
        width_mm: { type: number, exclusiveMinimum: 0 }
        height_mm: { type: number, exclusiveMinimum: 0 }

    LivenessView:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: alive }
    ReadinessView:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ready, degraded, unavailable] }
        code: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        checked_at: { $ref: '#/components/schemas/DateTime' }
    SystemStatusView:
      type: object
      additionalProperties: false
      required: [application_version, schema_version, runtime_offline, components, limits]
      properties:
        application_version: { type: string }
        schema_version: { type: string }
        runtime_offline: { type: boolean }
        components:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ComponentHealth' }
        limits:
          type: object
          additionalProperties:
            type: [string, number, integer, boolean]
    BackupView:
      type: object
      additionalProperties: false
      required: [id, status, format_version, schema_version, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [creating, verifying, verified, failed, deleted] }
        format_version: { type: integer, minimum: 1 }
        schema_version: { type: string }
        file_count: { type: [integer, 'null'], minimum: 0 }
        total_bytes: { type: [integer, 'null'], minimum: 0 }
        error:
          anyOf:
            - $ref: '#/components/schemas/BoundedError'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/DateTime' }
        completed_at: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        verified_at: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    MaintenanceJobView:
      type: object
      additionalProperties: false
      required: [id, kind, state, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [search_verify, search_rebuild, media_verify] }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress_current: { type: [integer, 'null'], minimum: 0 }
        progress_total: { type: [integer, 'null'], minimum: 0 }
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          anyOf:
            - $ref: '#/components/schemas/BoundedError'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
        completed_at: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
