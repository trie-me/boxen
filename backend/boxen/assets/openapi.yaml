  /search/suggestions:
    get:
      tags: [Discovery]
      operationId: suggestSearch
      summary: Suggest box codes or confirmed contents, tags, and collections as a query is typed.
      description: >-
        Uses the same viewer and anonymous-session permissions as searchBoxes. The query is trimmed
        and NFC-normalized. BX and BX- are reserved code intent; at least two code characters are
        required. Code prefixes accept case-insensitive O/I/L aliases for 0/1/1 and an optional
        hyphen after four characters. Incomplete or malformed code prefixes never fall through to
        text matching. Other queries require at least two Unicode letters or numbers and match
        case-folded name token prefixes. Text results contain only active confirmed inventory
        items and tags or collections with a box visible under all supplied filters. Box names
        and draft AI observations are not text suggestions. Results alternate items, tags, and
        collections in deterministic name order within each type. Code results use code order.
      parameters:
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/CollectionFilter'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 12, default: 8 }
      responses:
        '200':
          description: Bounded contextual suggestions; an insufficient or malformed prefix returns kind none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggestions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

