# Native-to-container Tailscale profile, retaining the old LAN read redirects.
# Tailscale runs on the host; no privileged sidecar or tailscaled socket mount.
services:
  caddy:
    command: [caddy, run, --config, /etc/caddy/Caddyfile.tailnet, --adapter, caddyfile]
    environment:
      BOXEN_HOST: ${BOXEN_HOST:?Set the Tailscale DNS name}
      BOXEN_HTTPS_PORT: ${BOXEN_HTTPS_PORT:-8443}
      BOXEN_LEGACY_HOST: ${BOXEN_LEGACY_HOST:?Set the previous LAN IP for redirects}
    # Compose retains the base IPv4 HTTPS binding and adds these five sockets.
    ports:
      - target: 8443
        published: "${BOXEN_HTTPS_PORT:-8443}"
        host_ip: ${BOXEN_TAILNET_IPV6:?Set the host Tailscale IPv6 address}
        protocol: tcp
      - target: 8080
        published: "${BOXEN_HTTP_PORT:-8000}"
        host_ip: ${BOXEN_BIND_ADDRESS:?Set the host Tailscale IPv4 address}
        protocol: tcp
      - target: 8080
        published: "${BOXEN_HTTP_PORT:-8000}"
        host_ip: ${BOXEN_TAILNET_IPV6:?Set the host Tailscale IPv6 address}
        protocol: tcp
      - target: 8443
        published: "${BOXEN_HTTPS_PORT:-8443}"
        host_ip: ${BOXEN_LEGACY_HOST:?Set the previous LAN IP for redirects}
        protocol: tcp
      - target: 8080
        published: "${BOXEN_HTTP_PORT:-8000}"
        host_ip: ${BOXEN_LEGACY_HOST:?Set the previous LAN IP for redirects}
        protocol: tcp
