env = "development"
origin = "http://127.0.0.1:8000"
# Use an absolute local path. Network shares are not supported for SQLite/WAL.
data_dir = "/absolute/local/path/to/boxen-data"
anonymous_access = "editor" # viewer is read-only; off requires accounts
# AI is optional. Provision artifacts and a verified manifest before enabling.
# ai_profile = "your-qualified-profile"
ai_base_url = "http://127.0.0.1:8080"
worker_slots = 1
backup_retention = 14
