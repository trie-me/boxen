name: boxen
x-app: &app
  image: ${BOXEN_IMAGE:-boxen:0.1.0}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  volumes:
    - type: volume
      source: boxen-data
      target: /var/lib/boxen
  environment:
    BOXEN_ENV: production
    # One hostname and public port control both TLS and the exact app origin.
    # For LAN access set BOXEN_HOST and BOXEN_BIND_ADDRESS to the LAN address.
    BOXEN_ORIGIN: https://${BOXEN_HOST:-localhost}:${BOXEN_HTTPS_PORT:-8443}
    # Restore renames the data root and retains its sibling quarantine.
    BOXEN_DATA_DIR: /var/lib/boxen/data
    BOXEN_ANONYMOUS_ACCESS: ${BOXEN_ANONYMOUS_ACCESS:-editor}
  networks: [private]
  pids_limit: 160
  mem_limit: 2g
  cpus: 2
  stop_grace_period: 330s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  init:
    <<: *app
    command: [init]
    restart: "no"
    profiles: [tools]
    # The one-time setup token is printed only during an explicit init run.
    logging: {driver: none}
  web:
    <<: *app
    command: [web, --host, 0.0.0.0]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready',headers={'Host':os.environ['BOXEN_ORIGIN'].split('://')[1]}); urllib.request.urlopen(r,timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
  caddy:
    image: ${BOXEN_CADDY_IMAGE:-boxen-caddy:0.1.0}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    ports:
      - target: 8443
        published: "${BOXEN_HTTPS_PORT:-8443}"
        host_ip: ${BOXEN_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    environment:
      BOXEN_HOST: ${BOXEN_HOST:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, ingress]
    depends_on:
      web: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  private:
    internal: true
  # Only the TLS proxy joins this bridge so Docker can publish its loopback port.
  # Web, worker and optional inference stay on the private network.
  ingress: {}
volumes:
  boxen-data:
  caddy-data:
  caddy-config:
