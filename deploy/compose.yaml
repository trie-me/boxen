name: boxen
x-app: &app
  image: boxen:0.1.0
  build:
    context: ..
    dockerfile: Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  volumes: [boxen-data:/var/lib/boxen]
  environment: &environment
    BOXEN_ENV: production
    BOXEN_ORIGIN: ${BOXEN_ORIGIN:-https://localhost:8443}
    # Restore renames the data root and retains its sibling quarantine.
    BOXEN_DATA_DIR: /var/lib/boxen/data
    BOXEN_ANONYMOUS_ACCESS: ${BOXEN_ANONYMOUS_ACCESS:-editor}
  networks: [private]
  pids_limit: 160
  mem_limit: 2g
  cpus: 2
  stop_grace_period: 330s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  init:
    <<: *app
    command: [init]
    restart: "no"
    profiles: [tools]
  web:
    <<: *app
    command: [web, --host, 0.0.0.0]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready',headers={'Host':os.environ['BOXEN_ORIGIN'].split('://')[1]}); urllib.request.urlopen(r,timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
  caddy:
    image: boxen-caddy:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.caddy
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    ports: ["${BOXEN_BIND_ADDRESS:-127.0.0.1}:${BOXEN_HTTPS_PORT:-8443}:8443"]
    environment:
      BOXEN_HOST: ${BOXEN_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, ingress]
    depends_on:
      web: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  private:
    internal: true
  # Only the TLS proxy joins this bridge so Docker can publish its loopback port.
  # Web, worker and optional inference stay on the private network.
  ingress: {}
volumes:
  boxen-data:
  caddy-data:
  caddy-config:
